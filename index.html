<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="€ ⇄ ¥">
<meta name="theme-color" content="#0e0e10">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>€ ⇄ ¥</title>
<style>
  :root{
    --bg:#0e0e10; --card:#18181b; --line:#2a2a2f; --text:#f5f0e8; --muted:#8a8680; --red:#bc202c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif}
  body{display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 20px)}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
  h1{font-size:15px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--muted)}
  h1 b{color:var(--red)}
  #refresh{background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;
    padding:6px 12px;font-size:13px}
  #refresh.spin{opacity:.5}
  .field{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px;
    display:flex;align-items:center;gap:14px;transition:border-color .2s}
  .field:focus-within{border-color:var(--red)}
  .cur{display:flex;flex-direction:column;min-width:54px}
  .sym{font-size:30px;font-weight:700;line-height:1}
  .code{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.06em}
  input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);
    font-size:40px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;font-family:inherit}
  input::placeholder{color:#3c3a37}
  .conv{display:flex;flex-direction:column}
  .conv.swapped #fJpy{order:1} .conv.swapped .mid{order:2} .conv.swapped #fEur{order:3}
  .mid{display:flex;justify-content:center;margin:-10px 0;position:relative;z-index:1}
  #swap{width:44px;height:44px;border-radius:50%;background:var(--red);border:4px solid var(--bg);
    color:#fff;font-size:18px;display:grid;place-items:center}
  #rate{margin:22px 4px 0;font-size:15px;color:var(--text)}
  #meta{margin:4px 4px 0;font-size:12px;color:var(--muted)}
  #meta.err{color:#e0796f}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
  .chip{flex:1 0 calc(25% - 8px);background:var(--card);border:1px solid var(--line);color:var(--text);
    border-radius:14px;padding:12px 0;font-size:15px;font-variant-numeric:tabular-nums}
  .chip:active,#swap:active,#refresh:active{transform:scale(.96)}
  .label{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:26px 4px -14px}
  .hbtns{display:flex;gap:8px}
  #gear{background:none;border:1px solid var(--line);color:var(--muted);border-radius:20px;width:34px;font-size:15px}
  .muted{color:var(--muted);font-size:13px}
  .scan{display:flex;align-items:center;gap:14px;margin-top:26px;padding:16px 18px;border-radius:18px;
    background:linear-gradient(135deg,#2a1215,#18181b);border:1px solid #4a1c22;cursor:pointer}
  .scan:active{transform:scale(.98)}
  .scan-ico{font-size:28px}
  .scan b{display:block;font-size:16px}
  .scan small{color:var(--muted);font-size:12px}
  #results{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
  .res-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
  .res-head>div{flex:1;min-width:0}
  #resTitle{font-weight:600}
  #thumb{width:52px;height:52px;object-fit:cover;border-radius:10px;background:#222}
  #resClose{background:none;border:0;color:var(--muted);font-size:18px;padding:6px}
  .item{display:flex;gap:10px;align-items:center;padding:12px 2px;border-top:1px solid var(--line)}
  .item.sel{background:#2a1215;border-radius:10px;padding:12px 8px}
  .item .t{flex:1;min-width:0}
  .item .fr{font-size:15px}
  .item .jp{font-size:12px;color:var(--muted);margin-top:2px}
  .item .p{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .item .e{font-size:17px;font-weight:600}
  .item .y{font-size:12px;color:var(--muted)}
  #resTotal{border-top:1px solid var(--line);padding-top:12px;margin-top:4px;display:flex;justify-content:space-between;font-weight:600}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:var(--red);
    border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(92vw,420px)}
  dialog::backdrop{background:rgba(0,0,0,.7)}
  dialog h2{margin:0 0 8px;font-size:18px}
  dialog a{color:#e0796f}
  dialog input,dialog select{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:12px;padding:12px;font-size:16px;margin-top:12px;font-family:inherit}
  dialog .row{display:block;margin-top:14px;font-size:13px;color:var(--muted)}
  .dlg-btns{display:flex;gap:10px;margin-top:18px}
  .dlg-btns button{flex:1;padding:12px;border-radius:12px;border:0;background:var(--red);color:#fff;font-size:15px;font-weight:600}
  .dlg-btns .ghost{background:none;border:1px solid var(--line);color:var(--text)}
  footer{margin-top:auto;padding-top:24px;font-size:11px;color:#55524e;text-align:center}
</style>
</head>
<body>
  <header>
    <h1>EUR <b>⇄</b> JPY</h1>
    <div class="hbtns">
      <button id="refresh" type="button">↻ Actualiser</button>
      <button id="gear" type="button" aria-label="Réglages">⚙︎</button>
    </div>
  </header>

  <div class="conv" id="conv">
  <div class="field" id="fEur">
    <div class="cur"><span class="sym">€</span><span class="code">EUR</span></div>
    <input id="eur" inputmode="decimal" autocomplete="off" placeholder="0">
  </div>
  <div class="mid"><button id="swap" type="button" aria-label="Inverser">⇅</button></div>
  <div class="field" id="fJpy">
    <div class="cur"><span class="sym">¥</span><span class="code">JPY</span></div>
    <input id="jpy" inputmode="numeric" autocomplete="off" placeholder="0">
  </div>
  </div>

  <div id="rate">Chargement du taux…</div>
  <div id="meta"></div>

  <label class="scan" id="scanBtn">
    <input type="file" id="photo" accept="image/*" hidden>
    <span class="scan-ico">📷</span>
    <span><b>Scanner des prix</b><small>Photo d'une carte, d'un menu, d'une étiquette</small></span>
  </label>

  <section id="results" hidden>
    <div class="res-head">
      <img id="thumb" alt="">
      <div><div id="resTitle">Analyse…</div><div id="resNote" class="muted"></div></div>
      <button id="resClose" type="button" aria-label="Fermer">✕</button>
    </div>
    <div id="resList"></div>
    <div id="resTotal" hidden></div>
  </section>

  <div class="label">Montants rapides</div>
  <div class="chips" id="chips"></div>

  <dialog id="settings">
    <h2>Réglages du scan</h2>
    <p class="muted">Le scan utilise l'IA Claude d'Anthropic. Colle ta clé API (elle reste uniquement sur cet appareil). Clé à créer sur <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.</p>
    <input id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label class="row">Modèle
      <select id="model">
        <option value="claude-haiku-5-5">Rapide (Haiku)</option>
        <option value="claude-sonnet-5-5">Précis (Sonnet)</option>
      </select>
    </label>
    <div class="dlg-btns">
      <button type="button" id="setCancel" class="ghost">Annuler</button>
      <button type="button" id="setSave">Enregistrer</button>
    </div>
  </dialog>

  <footer>Taux de référence BCE via frankfurter.dev · hors marge bancaire</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const eur = $('eur'), jpy = $('jpy');
  const KEY = 'eurjpy-rate';
  let rate = null, last = 'eur';
  let items = [], picked = new Set();

  const fmt = (n, d) => n.toLocaleString('fr-FR', {minimumFractionDigits: d, maximumFractionDigits: d});
  const parse = s => {
    const v = parseFloat(String(s).replace(/\s| | /g, '').replace(',', '.'));
    return isNaN(v) ? null : v;
  };

  function convert(from) {
    last = from;
    if (!rate) return;
    if (from === 'eur') {
      const v = parse(eur.value);
      jpy.value = v === null ? '' : fmt(Math.round(v * rate), 0);
    } else {
      const v = parse(jpy.value);
      eur.value = v === null ? '' : fmt(v / rate, 2);
    }
  }

  function showRate(r, date, fetchedAt, stale) {
    rate = r;
    $('rate').textContent = `1 € = ${fmt(r, 2)} ¥  ·  1 000 ¥ = ${fmt(1000 / r, 2)} €`;
    const d = new Date(date + 'T00:00:00');
    const t = new Date(fetchedAt);
    $('meta').className = stale ? 'err' : '';
    $('meta').textContent = (stale ? 'Hors ligne — dernier taux connu · ' : '') +
      `Taux du ${d.toLocaleDateString('fr-FR', {day: 'numeric', month: 'long'})}` +
      ` · vérifié à ${t.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'})}`;
    convert(last);
    renderItems();
  }

  async function getJSON(url) {
    const ctrl = new AbortController();
    const to = setTimeout(() => ctrl.abort(), 8000);
    try {
      const r = await fetch(url, {cache: 'no-store', signal: ctrl.signal});
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } finally { clearTimeout(to); }
  }

  async function load() {
    $('refresh').classList.add('spin');
    try {
      let r, date;
      try {
        const j = await getJSON('https://api.frankfurter.dev/v1/latest?base=EUR&symbols=JPY');
        r = j.rates.JPY; date = j.date;
      } catch {
        const j = await getJSON('https://open.er-api.com/v6/latest/EUR');
        r = j.rates.JPY; date = new Date(j.time_last_update_unix * 1000).toISOString().slice(0, 10);
      }
      const data = {r, date, at: Date.now()};
      try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {}
      showRate(r, date, data.at, false);
    } catch {
      let c = null;
      try { c = JSON.parse(localStorage.getItem(KEY)); } catch {}
      if (c) showRate(c.r, c.date, c.at, true);
      else { $('rate').textContent = 'Taux indisponible'; $('meta').className = 'err';
             $('meta').textContent = 'Vérifie ta connexion puis touche Actualiser.'; }
    } finally {
      $('refresh').classList.remove('spin');
    }
  }

  // Cached rate first (instant display), then refresh
  try {
    const c = JSON.parse(localStorage.getItem(KEY));
    if (c) showRate(c.r, c.date, c.at, false);
  } catch {}
  load();

  eur.addEventListener('input', () => convert('eur'));
  jpy.addEventListener('input', () => convert('jpy'));
  eur.addEventListener('focus', () => eur.select());
  jpy.addEventListener('focus', () => jpy.select());
  // reformat with thousands separators on blur
  jpy.addEventListener('blur', () => { const v = parse(jpy.value); if (v !== null) jpy.value = fmt(v, 0); });
  eur.addEventListener('blur', () => { const v = parse(eur.value); if (v !== null) eur.value = fmt(v, 2); });

  $('refresh').addEventListener('click', load);
  $('swap').addEventListener('click', () => {
    const swapped = $('conv').classList.toggle('swapped');
    (swapped ? jpy : eur).focus();
  });

  const chips = [500, 1000, 3000, 5000, 10000, 20000, 50000, 100000];
  chips.forEach(v => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button';
    b.textContent = (v >= 1000 ? fmt(v / 1000, 0) + 'k' : v) + ' ¥';
    b.addEventListener('click', () => { jpy.value = fmt(v, 0); convert('jpy'); });
    $('chips').appendChild(b);
  });

  // ---------- Scan de prix (Claude API) ----------
  const K_KEY = 'eurjpy-apikey', K_MODEL = 'eurjpy-model';
  const store = {
    get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
  };
  const dlg = $('settings');
  let pendingFile = null;

  function openSettings() {
    $('apiKey').value = store.get(K_KEY);
    $('model').value = store.get(K_MODEL) || 'claude-haiku-5-5';
    dlg.showModal();
  }
  $('gear').addEventListener('click', openSettings);
  $('setCancel').addEventListener('click', () => { pendingFile = null; dlg.close(); });
  $('setSave').addEventListener('click', () => {
    store.set(K_KEY, $('apiKey').value.trim());
    store.set(K_MODEL, $('model').value);
    dlg.close();
    if (pendingFile && store.get(K_KEY)) { const f = pendingFile; pendingFile = null; scan(f); }
  });

  $('photo').addEventListener('change', e => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (!store.get(K_KEY)) { pendingFile = f; openSettings(); return; }
    scan(f);
  });
  $('resClose').addEventListener('click', () => { $('results').hidden = true; items = []; picked.clear(); });

  // Downscale to keep upload small and fast
  function toJpeg(file, max = 1600) {
    return new Promise((res, rej) => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        res(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => rej(new Error("Image illisible"));
      img.src = URL.createObjectURL(file);
    });
  }

  const PROMPT = `Tu reçois la photo d'un menu, d'une carte, d'une grille tarifaire ou d'étiquettes de prix, probablement au Japon.
Extrais chaque article qui a un prix. Pour chacun : le nom original tel qu'écrit, une traduction française courte et naturelle (pour un plat, ajoute entre parenthèses une description très brève si le nom seul n'est pas parlant), et le prix en yens sous forme de nombre entier.
Si plusieurs prix pour un article (tailles, options), crée une ligne par prix et précise l'option dans la traduction.
Signale dans "note" si les prix sont hors taxe (税抜/税別) ou TTC (税込), et toute info utile (service charge, prix par personne, etc.). Sinon note vide.
Réponds UNIQUEMENT avec ce JSON, sans texte autour :
{"items":[{"original":"…","fr":"…","yen":1200}],"note":"…"}
Si aucun prix lisible : {"items":[],"note":"explication courte"}`;

  async function scan(file) {
    items = []; picked.clear();
    $('results').hidden = false;
    $('resList').innerHTML = '';
    $('resTotal').hidden = true;
    $('resTitle').innerHTML = '<span class="spinner"></span>Lecture et traduction…';
    $('resNote').textContent = '';
    try {
      const dataUrl = await toJpeg(file);
      $('thumb').src = dataUrl;
      $('results').scrollIntoView({behavior: 'smooth', block: 'start'});
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': store.get(K_KEY),
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: store.get(K_MODEL) || 'claude-haiku-5-5',
          max_tokens: 4096,
          messages: [{role: 'user', content: [
            {type: 'image', source: {type: 'base64', media_type: 'image/jpeg', data: dataUrl.split(',')[1]}},
            {type: 'text', text: PROMPT}
          ]}]
        })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        const msg = j.error?.message || ('Erreur ' + r.status);
        if (r.status === 401) throw new Error('Clé API invalide — vérifie-la dans ⚙︎');
        throw new Error(msg);
      }
      const text = (j.content || []).filter(b => b.type === 'text').map(b => b.text).join('');
      const m = text.match(/\{[\s\S]*\}/);
      if (!m) throw new Error('Réponse illisible, réessaie avec une photo plus nette');
      const out = JSON.parse(m[0]);
      items = (out.items || []).filter(it => Number.isFinite(+it.yen) && +it.yen > 0)
                               .map(it => ({...it, yen: Math.round(+it.yen)}));
      $('resTitle').textContent = items.length
        ? `${items.length} prix trouvé${items.length > 1 ? 's' : ''}` : 'Aucun prix trouvé';
      $('resNote').textContent = out.note || (items.length ? 'Touche des lignes pour les additionner' : '');
      renderItems();
    } catch (err) {
      $('resTitle').textContent = 'Échec du scan';
      $('resNote').textContent = err.name === 'TypeError' ? 'Pas de connexion ?' : err.message;
    }
  }

  function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function renderItems() {
    if (!items.length) return;
    $('resList').innerHTML = items.map((it, i) => `
      <div class="item${picked.has(i) ? ' sel' : ''}" data-i="${i}">
        <div class="t"><div class="fr">${esc(it.fr)}</div><div class="jp">${esc(it.original)}</div></div>
        <div class="p"><div class="e">${rate ? fmt(it.yen / rate, 2) + ' €' : '–'}</div>
          <div class="y">${fmt(it.yen, 0)} ¥</div></div>
      </div>`).join('');
    if (picked.size && rate) {
      const y = [...picked].reduce((s, i) => s + items[i].yen, 0);
      $('resTotal').innerHTML = `<span>Total (${picked.size})</span><span>${fmt(y, 0)} ¥ · ${fmt(y / rate, 2)} €</span>`;
      $('resTotal').hidden = false;
    } else $('resTotal').hidden = true;
  }
  $('resList').addEventListener('click', e => {
    const row = e.target.closest('.item'); if (!row) return;
    const i = +row.dataset.i;
    picked.has(i) ? picked.delete(i) : picked.add(i);
    renderItems();
  });

  // Refresh when the app comes back to the foreground, and every 30 min
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(load, 30 * 60 * 1000);
})();
</script>
</body>
</html>
